[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ads"
version = "0.1.0"
description = "Google Ads for agents: pay to be what the agent recommends"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
agent-ads = "agent_ads.__main__:main"

[tool.setuptools]
packages = ["agent_ads"]
